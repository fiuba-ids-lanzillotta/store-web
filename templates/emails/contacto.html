<!DOCTYPE html>
<html lang="es">
<body style="font-family: system-ui, sans-serif; color: #1f2430; max-width: 560px; margin: 0 auto; padding: 1.5rem;">
    <h2 style="color: #3155d4; margin-top: 0;">Nuevo mensaje de contacto</h2>
    <p><strong>Nombre:</strong> {{ nombre }}</p>
    <p><strong>Email:</strong> {{ email }}</p>
    <p><strong>Mensaje:</strong></p>
    <p style="background: #f6f7f9; border: 1px solid #e2e5ec; border-radius: 8px; padding: 1rem; white-space: pre-wrap;">{{ mensaje }}</p>
    <p style="color: #8a90a0; font-size: 0.85rem;">Enviado desde el formulario de contacto del sitio.</p>
</body>
</html>
